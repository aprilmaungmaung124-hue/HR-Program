<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - Amenity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans" x-data="{ sidebarOpen: true }">

    <div class="flex h-screen overflow-hidden">
        
        <aside 
            :class="sidebarOpen ? 'w-64' : 'w-20'" 
            class="bg-slate-900 text-white transition-all duration-300 ease-in-out flex flex-col z-20">
            
            <div class="p-6 text-xl font-bold border-b border-slate-800 flex justify-between items-center h-20">
                <span x-show="sidebarOpen" class="truncate">HR Portal</span>
                <button @click="sidebarOpen = !sidebarOpen" class="hover:text-blue-400">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>

            <nav class="flex-1 mt-4">
                <a href="#" class="flex items-center px-6 py-4 hover:bg-slate-800 transition-colors text-blue-400 bg-slate-800/50">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span x-show="sidebarOpen" class="ml-4">Dashboard</span>
                </a>
                <a href="#" class="flex items-center px-6 py-4 hover:bg-slate-800 transition-colors">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span x-show="sidebarOpen" class="ml-4">Employees</span>
                </a>
                <a href="#" class="flex items-center px-6 py-4 hover:bg-slate-800 transition-colors">
                    <i data-lucide="wallet" class="w-5 h-5"></i>
                    <span x-show="sidebarOpen" class="ml-4">Payroll</span>
                </a>
                <a href="#" class="flex items-center px-6 py-4 hover:bg-slate-800 transition-colors">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span x-show="sidebarOpen" class="ml-4">Reports</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-8">
            
            <header class="mb-8 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">HR Overview</h1>
                    <p class="text-gray-500 text-sm">Real-time workforce metrics</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-white p-2 rounded-full shadow-sm border border-gray-200">
                        <i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">H</div>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                    <div class="bg-blue-100 p-3 rounded-lg text-blue-600 mr-4">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold tracking-wider">Total</p>
                        <h3 class="text-2xl font-bold text-gray-800">452</h3>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                    <div class="bg-green-100 p-3 rounded-lg text-green-600 mr-4">
                        <i data-lucide="user-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold tracking-wider">Active</p>
                        <h3 class="text-2xl font-bold text-gray-800">410</h3>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                    <div class="bg-yellow-100 p-3 rounded-lg text-yellow-600 mr-4">
                        <i data-lucide="user-plus" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold tracking-wider">Probation</p>
                        <h3 class="text-2xl font-bold text-gray-800">32</h3>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center">
                    <div class="bg-red-100 p-3 rounded-lg text-red-600 mr-4">
                        <i data-lucide="user-minus" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-semibold tracking-wider">Resigned</p>
                        <h3 class="text-2xl font-bold text-gray-800">10</h3>
                    </div>
                </div>
            </div>

            <h2 class="text-lg font-bold text-gray-700 mb-4 px-1">Financials & Compliance</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-sm font-medium text-gray-500">Total Payroll</p>
                        <i data-lucide="banknote" class="w-5 h-5 text-indigo-400"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">124,500 <span class="text-sm font-normal text-gray-400">MMK</span></h3>
                </div>

                <div class="bg-blue p-6 rounded-xl shadow-sm border-l-4 border-purple-500">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-sm font-medium text-gray-500">SSB Contribution</p>
                        <i data-lucide="landmark" class="w-5 h-5 text-purple-400"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">12,400 <span class="text-sm font-normal text-gray-400">MMK</span></h3>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-orange-500">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-sm font-medium text-gray-500">Income Tax</p>
                        <i data-lucide="file-check" class="w-5 h-5 text-orange-400"></i>
                    </div>
